}

/* =====================================================================
   LAYAR: STRAVA
   ===================================================================== */
function mountStrava(ctx) {
  let syncing = false;
  const render = d => {
    const since = d.connectedAt ? fmt(d.connectedAt, { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    if (d.state === 'connected') {
      ctx.content.innerHTML = `
        <div class="card sum" style="margin-top:4px"><span class="sv-mark">${I('directions_run')}</span><div class="row-main"><b class="t-sub">Strava tersambung</b><span class="row-meta">${esc(d.athlete)}</span></div><span class="pill ok">${I('check_circle')}Aktif</span></div>
        <div class="card list detail-rows">
          <div class="row"><span class="lead tone-primary">${I('bolt')}</span><span class="row-main"><span class="row-title">Masuk otomatis</span><span class="row-meta wrap">Aktivitas baru di Strava masuk dalam beberapa menit, tanpa perlu membuka aplikasi ini.</span></span></div>
          <div class="row"><span class="lead">${I('sync')}</span><span class="row-main"><span class="row-title">Sinkron terakhir</span><span class="row-meta">${timeAgo(d.lastSync)}</span></span></div>
          <div class="row"><span class="lead">${I('calendar_today')}</span><span class="row-main"><span class="row-title">Tersambung sejak</span><span class="row-meta">${since}</span></span></div>
        </div>
        <button class="btn btn-tonal block js-sync ${syncing ? 'is-busy' : ''}" style="margin-top:16px">${syncing ? '<span class="spin"></span>Menyinkronkan…' : `${I('sync', 'sm')}Sinkronkan sekarang`}</button>
        <p class="help center" style="margin-top:8px">Pakai ini kalau ada aktivitas yang belum muncul setelah 15 menit.</p>
        <div class="group-label">Privasi</div>
        <div class="card"><div class="setting">
          <div class="lbl" style="margin-bottom:0"><span style="font-size:15px;color:var(--text)">Poin Strava di peringkat</span><button class="switch js-share" role="switch" aria-checked="${d.share}" aria-label="Poin Strava di peringkat"></button></div>
          <p class="help" style="margin-top:6px">${d.share
            ? `Rekan kerja melihat total poinmu, termasuk poin dari Strava. Detail aktivitas (rute, jarak, waktu) tetap hanya untukmu.${d.consentAt ? ` Disetujui ${fmt(d.consentAt, { day: 'numeric', month: 'long', year: 'numeric' })}.` : ''}`
            : 'Poin Strava tetap masuk ke total poinmu, tapi tidak dihitung di peringkat.'}</p></div></div>
        <div class="sec"><div class="sec-head"><h2 class="t-sub">Dari Strava</h2></div>
          ${d.recent.length ? `<div class="card list">${d.recent.map(a => actRow(a)).join('')}</div>` : '<div class="card empty">Belum ada aktivitas dari Strava.</div>'}</div>
        <button class="btn btn-text danger block js-disconnect" style="margin-top:16px">Putuskan Strava</button>`;
    } else if (d.state === 'broken') {
      ctx.content.innerHTML = `
        <div class="sv-hero"><span class="sv-mark lg">${I('link_off')}</span><h2 class="t-headline">Strava terputus</h2></div>
        <div class="note warn">${I('warning', 'sm')}<span><b>Sejak ${fmt(d.brokenSince, { weekday: 'long', day: 'numeric', month: 'short' })}</b> Strava menolak akses (password Strava diganti atau izin dicabut). Aktivitas sejak itu belum masuk.</span></div>
        <button class="btn btn-strava block js-connect" style="margin-top:20px">Sambungkan ulang Strava</button>
        <p class="help center" style="margin-top:8px">Setelah tersambung, aktivitas yang tertinggal diambil otomatis.</p>
        <div class="sec"><div class="sec-head"><h2 class="t-sub">Terakhir masuk</h2></div>
          ${d.recent.length ? `<div class="card list">${d.recent.slice(0, 3).map(a => actRow(a)).join('')}</div>` : ''}</div>`;
    } else {
      ctx.content.innerHTML = `
        <div class="sv-hero"><span class="sv-mark lg">${I('directions_run')}</span><h2 class="t-headline">Sambungkan Strava</h2><p class="muted">Olahraga yang direkam Strava masuk otomatis ke Wellbeing.</p></div>
        <ul class="benefits">
          <li>${I('bolt')}<span><b>Masuk sendiri</b><br><span class="muted">Dalam beberapa menit setelah aktivitas tersimpan di Strava.</span></span></li>
          <li>${I('local_fire_department')}<span><b>1 kkal = 1 poin</b><br><span class="muted">Sama seperti olahraga yang dicatat manual.</span></span></li>
          <li>${I('history')}<span><b>Tidak ada yang tertinggal</b><br><span class="muted">Aktivitas sejak awal bulan ikut diambil saat pertama tersambung.</span></span></li>
        </ul>
        <div class="note info">${I('info', 'sm')}<span>Di halaman izin Strava, biarkan izin <b>melihat aktivitas</b> tetap tercentang. Tanpa izin itu aktivitas tidak bisa diambil.</span></div>
        <label class="check js-consent-box"><input type="checkbox" class="js-consent"><span class="box">${I('check')}</span>
          <span>Saya setuju <b>poin</b> dari aktivitas Strava saya ikut dihitung di <b>peringkat</b> dan terlihat oleh rekan kerja. Detail aktivitas (rute, jarak, waktu) tetap hanya terlihat oleh saya. Persetujuan ini bisa saya tarik kapan saja.</span></label>
        <span class="err-text js-err-consent" hidden style="margin-top:6px">${I('error', 'xs')}Centang persetujuan dulu untuk menyambungkan.</span>
        <button class="btn btn-strava block js-connect" style="margin-top:20px">Sambungkan dengan Strava</button>
        <p class="help center" style="margin-top:8px">Satu akun Strava hanya untuk satu karyawan.</p>`;
    }
  };
  ctx.content.addEventListener('click', async e => {
    if (e.target.closest('.js-sync') && !syncing) {
      syncing = true; render(cache.get('/strava'));
      try {
        const r = await api.post('/strava/sync');
        toast(r.added.length ? `${r.added.length} aktivitas baru masuk (+${n(sum(r.added.map(a => a.points)))} poin).` : 'Sudah terbaru. Tidak ada aktivitas baru.', r.added.length ? 'success' : '');
        if (r.added.length) haptic();
        afterMutation();
      } catch (err) { toast(err.message, 'error', { label: 'Coba lagi', run: () => $('.js-sync', ctx.content)?.click() }); }
      finally { syncing = false; const d = cache.get('/strava'); if (d && ctx.el.isConnected) render(d); ctx.reload(); }
      return;
    }
    if (e.target.closest('.js-share')) {
      const sw = e.target.closest('.js-share'), on = sw.getAttribute('aria-checked') !== 'true';
      if (!on && !await confirmSheet({ title: 'Keluarkan poin Strava dari peringkat?', body: 'Poin Strava tetap masuk ke total poinmu, tapi tidak dihitung di peringkat dan rekan kerja tidak melihatnya. Bisa dinyalakan lagi kapan saja.', ok: 'Keluarkan' })) return;
      sw.setAttribute('aria-checked', String(on)); sw.classList.add('is-busy');
      try { await api.post('/strava/share', { on }); toast(on ? 'Poin Strava ikut dihitung di peringkat.' : 'Poin Strava tidak lagi dihitung di peringkat.'); afterMutation(); }
      catch (err) { sw.setAttribute('aria-checked', String(!on)); toast(err.message, 'error'); }
      finally { sw.classList.remove('is-busy'); }
      return;
    }
    if (e.target.closest('.js-connect')) {
      const box = $('.js-consent', ctx.content);
      if (box && !box.checked) {
        $('.js-consent-box', ctx.content).classList.add('invalid'); $('.js-err-consent', ctx.content).hidden = false;
        $('.js-consent-box', ctx.content).scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
        return;
      }
      const ov = overlay(`<span class="sv-mark lg">${I('directions_run')}</span><p class="t-sub">Membuka Strava…</p><p class="muted">Di aplikasi asli, halaman izin Strava terbuka di sini lalu kembali otomatis.</p>`);
      await sleep(1300);
      ov.set(`<span class="spin lg" style="color:var(--strava)"></span><p class="t-sub">Mengambil aktivitas…</p><p class="muted">Aktivitas yang tertinggal sedang dimasukkan.</p>`);
      try {
        const r = await api.post('/strava/connect', { consent: !!box?.checked });
        ov.close();
        toast(`Strava tersambung. ${r.added.length} aktivitas masuk (+${n(sum(r.added.map(a => a.points)))} poin).`, 'success');
        haptic(); afterMutation();
      } catch (err) { ov.close(); toast(err.message, 'error'); }
      return;
    }
    if (e.target.closest('.js-disconnect')) {
      if (!await confirmSheet({ title: 'Putuskan Strava?', body: 'Aktivitas yang sudah masuk tetap tersimpan beserta poinnya. Aktivitas baru tidak masuk lagi sampai kamu menyambung ulang.', ok: 'Putuskan', danger: true })) return;
      try { await api.post('/strava/disconnect'); toast('Strava diputus.'); afterMutation(); }
      catch (err) { toast(err.message, 'error'); }
    }
  });
  ctx.content.addEventListener('change', e => {
    if (!e.target.matches('.js-consent') || !e.target.checked) return;
    $('.js-consent-box', ctx.content).classList.remove('invalid'); $('.js-err-consent', ctx.content).hidden = true;
  });
  ctx.reload = () => loadInto(ctx, '/strava', render, () => `<div class="sk" style="height:72px;border-radius:16px;margin-top:4px"></div><div style="height:16px"></div>${skRows(3)}<div style="height:16px"></div><div class="sk" style="height:48px;border-radius:12px"></div>`);
  ctx.reload();
}

function mountLedger(ctx) {

  const host = $('.js-led', ctx.content);
  const render = d => {
    host.innerHTML = `<div class="card list">${d.items.map(x => `<div class="row"><span class="lead ${x.dim ? 'd-' + x.dim : x.amount < 0 ? 'tone-coin' : 'tone-primary'}">${I(x.icon)}</span><span class="row-main"><span class="row-title">${esc(x.title)}</span><span class="row-meta">${esc(x.sub)} · ${dayLabel(x.date)}</span></span><b class="pts ${x.amount < 0 ? 'neg' : ''}">${x.amount < 0 ? '−' : '+'}${n(Math.abs(x.amount))}</b></div>`).join('')}</div>
      ${st.type === 'coins' ? `<div class="note">${I('info', 'sm')}<span>Koin bertambah sebanyak poin yang kamu dapat, dan berkurang saat ditukar.</span></div>` : ''}`;
  };
  const load = () => loadInto(ctx, `/ledger?type=${st.type}`, render, () => skRows(7), host);
  ctx.content.addEventListener('click', e => {
    const b = e.target.closest('[data-ty]');
    if (b && b.dataset.ty !== st.type) { st.type = b.dataset.ty; $$('[data-ty]', ctx.content).forEach(x => x.setAttribute('aria-pressed', x.dataset.ty === st.type)); load(); }
  });
  ctx.reload = load;
  load();
}

/* =====================================================================

   ===================================================================== */
function showLogin() {
  const el = document.createElement('div');
  el.className = 'login';
  el.innerHTML = `
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="9" r="6" fill="var(--d-physical)"/><circle cx="38.3" cy="19.4" r="6" fill="var(--d-emotional)"/>
      <circle cx="32.8" cy="36.1" r="6" fill="var(--d-social)"/><circle cx="15.2" cy="36.1" r="6" fill="var(--d-financial)"/>
      <circle cx="9.7" cy="19.4" r="6" fill="var(--d-spiritual)"/></svg>
    <h1 class="t-title" style="margin-top:20px">Wellbeing</h1>
    <p class="muted" style="margin-top:4px">Masuk dengan akun WAM kamu.</p>
    <form novalidate>
      <label class="field"><span class="lbl">Email atau nama panggilan</span><input class="input" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="mis. dewi"></label>
      <label class="field"><span class="lbl">Password</span><div class="input-wrap"><input class="input" name="password" type="password" autocomplete="current-password" placeholder="Password"><button type="button" class="icon-btn pw-toggle" aria-label="Tampilkan password">${I('visibility')}</button></div></label>
      <div class="js-err"></div>
      <button class="btn btn-primary block js-submit" style="margin-top:24px">Masuk</button>
      <div class="center" style="margin-top:8px"><button type="button" class="link js-forgot">Lupa password?</button></div>
    </form>
    <p class="foot caption faint">Satu akun untuk WAM, Booking Kantor, dan Wellbeing.<br>Prototipe: isi apa saja; password <b>salah</b> untuk melihat pesan gagal.</p>`;
  app.appendChild(el);
  const form = $('form', el), btn = $('.js-submit', el), err = $('.js-err', el), pw = $('[name=password]', el);
  $('.pw-toggle', el).addEventListener('click', e => {
    const show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
    e.currentTarget.innerHTML = I(show ? 'visibility_off' : 'visibility');
    e.currentTarget.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  });
  $('.js-forgot', el).addEventListener('click', () => toast('Minta reset ke admin WAM: password dikembalikan ke password awal.', 'info'));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const user = form.user.value.trim(), password = pw.value;
    err.innerHTML = '';
    btn.classList.add('is-busy'); btn.innerHTML = '<span class="spin"></span>Masuk…';
    try {
      const r = await api.post('/login', { user, password });
      SESSION = { me: r.me, at: Date.now() }; writeLS('wb-proto-session', SESSION);
      el.style.transition = 'opacity .25s'; el.style.opacity = '0';
      startApp();
      setTimeout(() => el.remove(), 260);
    } catch (ex) {
      err.innerHTML = `<div class="note err">${I('error', 'sm')}<span>${esc(ex.message)}</span></div>`;
      btn.classList.remove('is-busy'); btn.textContent = 'Masuk';
    }
  });
  setTimeout(() => form.user.focus(), 100);
}

/* =====================================================================
   AKSI GLOBAL + MULAI
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('a[data-tab], [data-nav], [data-go-tab], [data-action], [data-act], [data-quest], [data-reward], [data-sheet-close]');
  if (!t) return;
  if (t.matches('a[data-tab]')) { e.preventDefault(); go(t.dataset.tab); return; }
  if (t.hasAttribute('data-sheet-close')) { currentSheet && currentSheet.close(); return; }
  if (t.dataset.nav) { go(t.dataset.nav, (t.dataset.params || '').split('/').filter(Boolean)); return; }
  if (t.dataset.goTab) { go(t.dataset.goTab); return; }
  if (t.dataset.action === 'back') { goBack(); return; }
  if (t.dataset.action === 'catat') { openCatat(); return; }
  if (t.dataset.act) { openActivity(t.dataset.act); return; }
  if (t.dataset.quest) { openQuest(t.dataset.quest); return; }
  if (t.dataset.reward) { openReward(t.dataset.reward); }
});
// Ambil data lebih dulu saat jari menyentuh tab, supaya terasa instan.
const PREFETCH = { beranda: '/home', quest: '/quests', peringkat: '/leaderboard?period=month&dim=all', rewards: '/rewards' };
tabbar.addEventListener('pointerdown', e => {
  const a = e.target.closest('[data-tab]'); const key = a && PREFETCH[a.dataset.tab];
  if (key && !cache.has(key)) api.get(key).then(d => cache.set(key, d)).catch(() => {});
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && currentSheet) currentSheet.close(); });
const syncOnline = () => { $('#offline').hidden = navigator.onLine; };
addEventListener('online', () => { syncOnline(); toast('Kembali online.', 'success'); afterMutation(); });
addEventListener('offline', syncOnline);

function applyTheme() {
  const r = document.documentElement;
  if (settings.theme === 'system') delete r.dataset.theme; else r.dataset.theme = settings.theme;
  const dark = settings.theme === 'dark' || (settings.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#0E1116' : '#F6F7F9');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

function startApp() {
  tabbar.hidden = false;
  const { name, params } = parseHash();
  if (!ROUTES[name].tab) {
    history.replaceState({ i: 0 }, '', '#/beranda'); histIndex = 0; showTab('beranda', false);
    histIndex = 1; history.pushState({ i: 1 }, '', '#/' + [name, ...params].join('/')); pushScreen(name, params, false);
  } else {
    history.replaceState({ i: 0 }, '', '#/' + name); histIndex = 0; showTab(name, false);
  }
}

applyTheme();
syncOnline();
if (SESSION) startApp(); else showLogin();
})();
</script>
</body>
</html>
