<html lang="id">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&icon_names=account_balance_wallet,add,add_a_photo,add_circle,alternate_email,arrow_back,badge,bolt,calendar_today,cancel,check,check_circle,checkroom,chevron_right,close,cloud_off,directions_bike,directions_run,directions_walk,diversity_3,edit_note,error,event_available,fitness_center,flag,history,home,image,info,leaderboard,link_off,local_cafe,local_drink,local_fire_department,logout,notes,photo_camera,pool,psychology,receipt_long,redeem,refresh,restart_alt,savings,schedule,science,self_improvement,spa,sports_gymnastics,sports_soccer,sports_tennis,sync,toll,trending_up,tune,umbrella,verified,visibility,visibility_off,warning,wifi_off&display=block">
<style>
/* =====================================================================
   Wellbeing — prototipe UI (16 Nov 2026)
   Gaya: brain/aturan/desain-ui.md (HIG + Material 3). Satu berkas, tanpa build.
   Semua data lewat lapisan `api` tiruan di bawah; ganti ke fetch() ke API asli.
   ===================================================================== */
:root{
  --font:'Plus Jakarta Sans',Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --frame:#E9ECF1;
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6; --outline:#E4E7EC;
  --text:#111827; --text-2:#4B5563; --text-3:#6B7280;
  --primary:#2F6FEB; --on-primary:#FFFFFF; --primary-c:#E3ECFD; --on-primary-c:#1D4ED8; --link:#2563EB;
  --pos:#15803D;
  --success:#16A34A; --success-c:#DCFCE7; --on-success-c:#166534;
  --warning:#D97706; --warning-c:#FEF3C7; --on-warning-c:#92400E;
  --error:#DC2626; --error-c:#FEE2E2; --on-error-c:#991B1B;
  --inverse:#1F2937; --on-inverse:#F9FAFB;
  --strava:#FC4C02;
  --d-physical:#0D9488; --d-physical-c:#CCFBF1;
  --d-emotional:#7C3AED; --d-emotional-c:#EDE9FE;
  --d-social:#EA580C; --d-social-c:#FFEDD5;
  --d-financial:#2F6FEB; --d-financial-c:#E3ECFD;
  --d-spiritual:#DB2777; --d-spiritual-c:#FCE7F3;
  --coin:#D97706;
  --scrim:rgba(17,24,39,.42);
  --shimmer:rgba(255,255,255,.65);
  --shadow-float:0 8px 24px rgba(17,24,39,.12),0 2px 6px rgba(17,24,39,.06);
  --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.05,.7,.1,1); --ease-in:cubic-bezier(.3,0,.8,.15);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --bar-h:56px; --nav-h:68px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --frame:#07090C;
    --bg:#0E1116; --surface:#171B22; --surface-2:#1F242D; --outline:#2A303A;
    --text:#F3F4F6; --text-2:#C2C8D0; --text-3:#8B93A0;
    --primary:#8AB4F8; --on-primary:#0E1116; --primary-c:rgba(138,180,248,.16); --on-primary-c:#B9D2FB; --link:#8AB4F8;
    --pos:#4ADE80;
    --success:#4ADE80; --success-c:rgba(74,222,128,.14); --on-success-c:#86EFAC;
    --warning:#FBBF24; --warning-c:rgba(251,191,36,.14); --on-warning-c:#FCD34D;
    --error:#F87171; --error-c:rgba(248,113,113,.14); --on-error-c:#FCA5A5;
    --inverse:#F3F4F6; --on-inverse:#111827;
    --d-physical:#5EEAD4; --d-physical-c:rgba(94,234,212,.14);
    --d-emotional:#C4B5FD; --d-emotional-c:rgba(196,181,253,.14);
    --d-social:#FDBA74; --d-social-c:rgba(253,186,116,.14);
    --d-financial:#8AB4F8; --d-financial-c:rgba(138,180,248,.14);
    --d-spiritual:#F9A8D4; --d-spiritual-c:rgba(249,168,212,.14);
    --coin:#FBBF24;
    --scrim:rgba(0,0,0,.6);
    --shimmer:rgba(255,255,255,.06);
    --shadow-float:0 8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --frame:#07090C;
  --bg:#0E1116; --surface:#171B22; --surface-2:#1F242D; --outline:#2A303A;
  --text:#F3F4F6; --text-2:#C2C8D0; --text-3:#8B93A0;
  --primary:#8AB4F8; --on-primary:#0E1116; --primary-c:rgba(138,180,248,.16); --on-primary-c:#B9D2FB; --link:#8AB4F8;
  --pos:#4ADE80;
  --success:#4ADE80; --success-c:rgba(74,222,128,.14); --on-success-c:#86EFAC;
  --warning:#FBBF24; --warning-c:rgba(251,191,36,.14); --on-warning-c:#FCD34D;
  --error:#F87171; --error-c:rgba(248,113,113,.14); --on-error-c:#FCA5A5;
  --inverse:#F3F4F6; --on-inverse:#111827;
  --d-physical:#5EEAD4; --d-physical-c:rgba(94,234,212,.14);
  --d-emotional:#C4B5FD; --d-emotional-c:rgba(196,181,253,.14);
  --d-social:#FDBA74; --d-social-c:rgba(253,186,116,.14);
  --d-financial:#8AB4F8; --d-financial-c:rgba(138,180,248,.14);
  --d-spiritual:#F9A8D4; --d-spiritual-c:rgba(249,168,212,.14);
  --coin:#FBBF24;
  --scrim:rgba(0,0,0,.6);
  --shimmer:rgba(255,255,255,.06);
  --shadow-float:0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- dasar ---------- */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--text);background:var(--frame);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  overflow:hidden;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-user-select:none;user-select:none;touch-action:manipulation}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.block{display:block}.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;width:1em;height:1em;overflow:hidden;flex:none;
  -webkit-user-select:none;user-select:none;vertical-align:middle}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.sm{font-size:20px}.ms.xs{font-size:16px}.ms.lg{font-size:32px}.ms.xl{font-size:44px}

.t-display{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.08;font-variant-numeric:tabular-nums}
.t-title{font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.t-headline{font-size:22px;font-weight:700;line-height:1.25}
.t-sub{font-size:17px;font-weight:600;line-height:1.3}
.t-label{font-size:13px;font-weight:600}
.caption{font-size:12px}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- kerangka aplikasi ---------- */
#app{position:fixed;inset:0;margin:0 auto;max-width:440px;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:600px) and (min-height:640px){
  #app{top:24px;bottom:24px;border-radius:28px;border:1px solid var(--outline);box-shadow:0 24px 64px rgba(17,24,39,.16)}
}
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.screen.is-push{z-index:5;box-shadow:-12px 0 32px rgba(17,24,39,.10)}
.screen.under{visibility:hidden}
.bar{flex:none;height:calc(var(--bar-h) + var(--safe-t));padding:var(--safe-t) 8px 0 4px;display:flex;align-items:center;gap:4px;
  background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s var(--ease);position:relative;z-index:2}
.is-tab .bar{padding-left:16px}
.bar.scrolled{border-bottom-color:var(--outline)}
.bar-title{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s var(--ease)}
.bar.always .bar-title,.bar.scrolled .bar-title{opacity:1}
.bar-actions{display:flex;align-items:center;gap:4px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;position:relative;scrollbar-width:none}
.scroll::-webkit-scrollbar,.sheet-body::-webkit-scrollbar{display:none}
.content{padding:0 16px calc(var(--nav-h) + var(--safe-b) + 32px)}
.is-push .content{padding-bottom:calc(var(--safe-b) + 32px)}
.large-title{font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.15;padding:0 0 16px}

.ptr{position:absolute;top:calc(var(--bar-h) + var(--safe-t) - 40px);left:50%;transform:translate(-50%,0);width:40px;height:40px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-float);display:grid;place-items:center;color:var(--primary);opacity:0;z-index:3;pointer-events:none}
.ptr.spinning .ms{animation:rot .8s linear infinite}

@keyframes push-in{from{transform:translateX(100%)}to{transform:none}}
@keyframes push-under{from{transform:none}to{transform:translateX(-24%)}}
@keyframes pop-out{from{transform:none}to{transform:translateX(100%)}}
@keyframes pop-under{from{transform:translateX(-24%)}to{transform:none}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim-push-in{animation:push-in .34s var(--ease-out) both}
.anim-push-under{animation:push-under .34s var(--ease-out) both}
.anim-pop-out{animation:pop-out .28s var(--ease) both}
.anim-pop-under{animation:pop-under .28s var(--ease) both}
.anim-fade{animation:fade-up .22s var(--ease) both}

/* tab bar (Material 3 navigation bar) */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:3;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--surface);border-top:1px solid var(--outline);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;font-size:12px;font-weight:600;color:var(--text-2)}
.tab .ind{width:56px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .2s var(--ease),transform .15s var(--ease)}
.tab:active .ind{transform:scale(.92)}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] .ind{background:var(--primary-c);color:var(--on-primary-c)}
.tab[aria-current="page"] .ms{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.tab-catat{color:var(--text)}
.tab-catat .ind{background:var(--primary);color:var(--on-primary)}
#app.no-nav .tabbar{visibility:hidden}

/* ---------- komponen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;
  font-weight:600;font-size:15px;transition:background .15s var(--ease),transform .15s var(--ease),opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-tonal{background:var(--primary-c);color:var(--on-primary-c)}
.btn-outline{border:1px solid var(--outline);background:var(--surface);color:var(--text)}
.btn-strava{background:var(--strava);color:#fff}
.btn-danger{background:var(--error);color:#fff}
.btn-text{color:var(--link);padding:0 12px}
.btn-text.danger{color:var(--error)}
.btn.block{width:100%}
.btn[disabled],.btn.is-busy{opacity:.55;pointer-events:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--text);flex:none;transition:background .15s}
.icon-btn:active{background:var(--surface-2)}
.link{color:var(--link);font-weight:600;font-size:13px;min-height:44px;padding:0 4px;display:inline-flex;align-items:center}
.pressable{transition:background .15s var(--ease),transform .15s var(--ease)}
.pressable:active{transform:scale(.985)}

.avatar{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;
  background:var(--av-bg,var(--primary-c));color:var(--av-fg,var(--on-primary-c))}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:44px;height:44px;font-size:15px}
.avatar.xl{width:80px;height:80px;font-size:26px}
.av-physical{--av-bg:var(--d-physical-c);--av-fg:var(--d-physical)}
.av-emotional{--av-bg:var(--d-emotional-c);--av-fg:var(--d-emotional)}
.av-social{--av-bg:var(--d-social-c);--av-fg:var(--d-social)}
.av-financial{--av-bg:var(--d-financial-c);--av-fg:var(--d-financial)}
.av-spiritual{--av-bg:var(--d-spiritual-c);--av-fg:var(--d-spiritual)}
.bar-avatar{width:44px;height:44px;display:grid;place-items:center;border-radius:999px}

.card{background:var(--surface);border:1px solid var(--outline);border-radius:16px}
.card.pad{padding:16px}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;text-align:left;position:relative;color:var(--text)}
.row.tall{align-items:flex-start;padding-top:14px;padding-bottom:14px}
.list > .row + .row::before,.list > .row + .row-wrap::before,.list > .row-wrap + .row::before{content:'';position:absolute;top:0;left:68px;right:0;border-top:1px solid var(--outline)}
button.row:active,a.row:active{background:var(--surface-2)}
.row[disabled]{opacity:.55;cursor:default}
.lead{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text-2)}
.lead.lg{width:48px;height:48px;border-radius:14px}
.lead.sm{width:32px;height:32px;border-radius:10px}
.lead.sm .ms{font-size:18px}
.d-physical{background:var(--d-physical-c);color:var(--d-physical)}
.d-emotional{background:var(--d-emotional-c);color:var(--d-emotional)}
.d-social{background:var(--d-social-c);color:var(--d-social)}
.d-financial{background:var(--d-financial-c);color:var(--d-financial)}
.d-spiritual{background:var(--d-spiritual-c);color:var(--d-spiritual)}
.tone-primary{background:var(--primary-c);color:var(--on-primary-c)}
.tone-strava{background:var(--strava);color:#fff}
.tone-coin{background:var(--warning-c);color:var(--coin)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta.wrap{white-space:normal}
.row-trail{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.pts{font-weight:700;color:var(--pos);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts.neg{color:var(--error)}
.pts.muted{color:var(--text-3);text-decoration:line-through;font-weight:600}
.chev{color:var(--text-3)}

.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.pill .ms{font-size:14px}
.pill.ok{background:var(--success-c);color:var(--on-success-c)}
.pill.warn{background:var(--warning-c);color:var(--on-warning-c)}
.pill.err{background:var(--error-c);color:var(--on-error-c)}
.pill.info{background:var(--primary-c);color:var(--on-primary-c)}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(17,24,39,.08),0 0 0 1px var(--outline)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--outline);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.chip .ms{font-size:18px}
.chip[aria-pressed="true"]{background:var(--primary-c);border-color:transparent;color:var(--on-primary-c)}

.sec{margin-top:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:32px}
.group-label{font-size:13px;font-weight:600;color:var(--text-2);margin:24px 4px 8px}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--text-2);margin-top:16px}
.note .ms{flex:none;margin-top:-1px}
.note.info{background:var(--primary-c);color:var(--on-primary-c)}
.note.warn{background:var(--warning-c);color:var(--on-warning-c)}
.note.err{background:var(--error-c);color:var(--on-error-c)}
.note.ok{background:var(--success-c);color:var(--on-success-c)}
.note b{font-weight:700}
.note .note-act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

.bar-meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar-meter i{display:block;height:100%;border-radius:999px;transition:width .4s var(--ease)}

.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;flex:none;display:inline-block}
.spin.lg{width:36px;height:36px;border-width:3px}
@keyframes rot{to{transform:rotate(360deg)}}

.sk{background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--shimmer),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk-line{height:12px;border-radius:6px}
.sk-row{display:flex;gap:12px;align-items:center;padding:12px 16px}
.sk-row .sk-av{width:40px;height:40px;border-radius:12px}

.empty{padding:40px 24px;text-align:center;color:var(--text-2)}
.empty .lead{margin:0 auto 12px;width:56px;height:56px;border-radius:16px}
.state{padding:48px 24px;text-align:center}
.state .lead{margin:0 auto 16px;width:56px;height:56px;border-radius:16px}
.state p{margin:6px 0 20px;color:var(--text-2)}

/* ---------- beranda ---------- */
.greet{padding:0 0 16px}
.hero{background:var(--primary-c);border-radius:24px;padding:20px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .t-label{color:var(--on-primary-c)}
.rank{background:var(--surface);border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;min-width:76px}
.rank b{font-size:22px;font-weight:800;line-height:1.1}
.rank span{font-size:12px;color:var(--text-2)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;min-width:0}
.stat b{display:block;font-size:15px;font-weight:700;white-space:nowrap}
.stat span{font-size:12px;color:var(--text-2)}
.ic-coin{color:var(--coin)}.ic-fire{color:var(--d-social)}.ic-up{color:var(--pos)}

.spark-col.is-today span{font-weight:700}
.dimline{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dimline b{font-variant-numeric:tabular-nums;font-size:15px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.qmini{flex:0 0 76%;scroll-snap-align:start;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:132px}

.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;width:100%;text-align:left;margin-bottom:12px}

/* ---------- quest ---------- */
.qcard{display:flex;flex-direction:column;gap:8px;padding:16px;text-align:left;width:100%;margin-bottom:12px}
.qcard h3{font-size:16px;font-weight:600;line-height:1.35}
.qtop{display:flex;align-items:center;gap:8px}
.qtop .caption{flex:1;color:var(--text-2);font-weight:600}
.qfoot{display:flex;gap:16px;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.qfoot span{display:inline-flex;align-items:center;gap:4px}
.qfoot .soon{color:var(--on-warning-c);font-weight:600}

/* ---------- peringkat ---------- */
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px;margin:20px 0 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .nm{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pp{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pod .base{width:100%;border-radius:12px 12px 4px 4px;background:var(--surface);border:1px solid var(--outline);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--text-2)}
.pod.r1 .base{height:96px;background:var(--primary-c);border-color:transparent;color:var(--on-primary-c)}
.pod.r2 .base{height:72px}.pod.r3 .base{height:56px}
.pod.is-me .nm{color:var(--link)}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;position:relative}
.list > .lb-row + .lb-row::before{content:'';position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--outline)}
.lb-rank{width:28px;text-align:center;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;flex:none}
.lb-row.is-me{background:var(--primary-c)}
.me-sticky{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);margin-top:16px;border-radius:16px;background:var(--surface);border:1px solid var(--outline);box-shadow:var(--shadow-float);z-index:1}

/* ---------- rewards ---------- */
.wallet{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--warning-c);margin-bottom:16px}
.wallet b{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.wallet .caption{color:var(--on-warning-c);font-weight:600}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.ritem{display:flex;flex-direction:column;gap:8px;padding:12px;text-align:left}
.ritem .thumb{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.ritem .thumb .ms{font-size:40px}
.ritem h3{font-size:14px;font-weight:600;line-height:1.35;min-height:38px}
.ritem .cost{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.ritem .cost .ms{font-size:18px;color:var(--coin)}
.ritem .sub{font-size:12px;color:var(--text-2)}
.ritem.short .sub{color:var(--on-warning-c)}

/* ---------- profil & pengaturan ---------- */
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0 20px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr)}

.switch{width:52px;height:32px;border-radius:999px;background:var(--surface-2);border:1px solid var(--outline);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:999px;background:var(--text-3);transition:transform .2s var(--ease),background .2s}
.switch[aria-checked="true"]{background:var(--primary);border-color:transparent}

.check{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid var(--outline);background:var(--surface);

  transition:background .15s,border-color .15s,color .15s}
.check .box .ms{font-size:18px;font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 20}
.check input:checked + .box{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

.grab span{width:36px;height:4px;border-radius:2px;background:var(--outline)}
.sheet-head{display:flex;align-items:center;gap:4px;padding:0 8px 4px;min-height:48px;flex:none;touch-action:none}
.sheet-head .sheet-title{flex:1;min-width:0;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head [data-sheet-back]:not([hidden]) + .sheet-title{padding-left:0}
.sheet-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 20px;overscroll-behavior:contain;scrollbar-width:none}
.sheet-foot{flex:none;padding:12px 16px 16px;border-top:1px solid var(--outline)}
.sheet-foot .note{margin:0 0 12px}
.step{animation:fade-up .2s var(--ease) both}
.step-fwd{animation:step-fwd .28s var(--ease-out) both}
.step-back{animation:step-back .28s var(--ease-out) both}
@keyframes step-fwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes step-back{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.progress{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--primary);transition:width .3s var(--ease)}

.opt{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;border:1px solid var(--outline);background:var(--surface);text-align:left;width:100%;margin-top:12px}
.opt .row-main{gap:4px}
.opt .row-main span{font-size:13px;color:var(--text-2)}
.sum{display:flex;align-items:center;gap:12px;padding:12px 14px}
.sum b.wrap{font-size:15px}

.field{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.field .lbl{font-size:13px;font-weight:600;color:var(--text-2)}
.input{min-height:48px;width:100%;border-radius:12px;border:1px solid var(--outline);background:var(--surface);padding:0 14px;font-size:16px;color:var(--text);
  -webkit-appearance:none;appearance:none;transition:border-color .15s}
.input:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
.input.invalid{border-color:var(--error)}
textarea.input{min-height:92px;padding:12px 14px;resize:none;line-height:1.45}
input[type="date"].input{display:block}
.input-wrap{position:relative}
.input-wrap .input{padding-right:76px}
.suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-3);pointer-events:none}
.pw-toggle{position:absolute;right:2px;top:50%;transform:translateY(-50%)}
.help{font-size:12px;color:var(--text-3)}
.err-text{font-size:12px;color:var(--error);font-weight:600;display:flex;gap:4px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .field{margin-top:18px}
.sport-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sport{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;border-radius:12px;border:1px solid var(--outline);
  background:var(--surface);font-size:12px;font-weight:600;color:var(--text-2);transition:background .15s,border-color .15s}
.sport[aria-pressed="true"]{background:var(--d-physical-c);border-color:var(--d-physical);color:var(--text)}
.sport[aria-pressed="true"] .ms{color:var(--d-physical)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:var(--surface-2);display:grid;place-items:center;color:var(--text-3)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:999px;background:rgba(17,24,39,.64);color:#fff;display:grid;place-items:center}
.ph .rm::after{content:'';position:absolute;inset:-6px}
.ph .rm .ms{font-size:18px}
.ph-add{border:1.5px dashed var(--outline);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-2);font-size:12px;font-weight:600}
.ph-add.invalid{border-color:var(--error);color:var(--error)}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 8px 8px}
.done-mark{width:88px;height:88px;border-radius:999px;background:var(--success-c);color:var(--success);display:grid;place-items:center;margin-bottom:10px;
  animation:pop .45s var(--ease-out) both}
.done-mark .ms{font-size:48px;font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 48}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.done-pts{font-size:32px;font-weight:800;color:var(--pos);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.detail-rows{margin-top:16px}
.detail-rows .row{min-height:52px}
.kv{display:flex;justify-content:space-between;gap:16px;width:100%}
.kv span:first-child{color:var(--text-2)}
.kv span:last-child{font-weight:600;text-align:right}

/* ---------- toast & banner luring ---------- */
.toast-host{position:absolute;left:16px;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:20;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#app.no-nav .toast-host,#app.has-sheet .toast-host{bottom:calc(var(--safe-b) + 16px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 8px 10px 14px;border-radius:12px;background:var(--inverse);color:var(--on-inverse);
  box-shadow:var(--shadow-float);font-size:14px;font-weight:500;max-width:100%;animation:fade-up .22s var(--ease-out) both}
.toast.out{animation:toast-out .2s var(--ease-in) both}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
.toast > span:not(.ms){flex:1;padding-right:6px}
.toast.success .ms{color:#4ADE80}.toast.error .ms{color:#F87171}.toast.warning .ms{color:#FBBF24}
:root[data-theme="dark"] .toast.success .ms{color:var(--success)}
.toast-act{color:#8AB4F8;font-weight:700;font-size:14px;padding:0 10px;min-height:36px}
.offline{position:absolute;left:0;right:0;top:0;z-index:15;padding:calc(var(--safe-t) + 6px) 16px 6px;background:var(--inverse);color:var(--on-inverse);font-size:13px;font-weight:600;
  display:flex;gap:8px;align-items:center;justify-content:center}

/* ---------- masuk ---------- */
.login{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 56px) 24px calc(var(--safe-b) + 24px)}
.login form{margin-top:28px}
.login .foot{margin-top:auto;padding-top:24px;text-align:center}

.overlay{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:24px;animation:fade-up .2s var(--ease) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

<script>
(() => {
'use strict';

/* =====================================================================
   KONTRAK API (yang nanti dibuat di Journey, prefix /api/wellbeing)
   Semua dipanggil lewat `api` di bawah. Di prototipe, `server()` meniru
   jawabannya dari data contoh di localStorage.

   POST /login                      {user, password} -> {me}
   GET  /me                         -> {me, totals, strava}
   GET  /home                       -> {me, totals, dims[], quests[], recent[], strava}
   GET  /catalog                    -> {daily[]}   (jenis kegiatan + poin + batas)
   GET  /activities?filter&page     -> {items[], hasMore}
   GET  /activities/:id             -> {activity}
   POST /activities                 {kind, code|sport, date, steps?, kcal?, minutes?, note, photos, force?}
                                    -> {activity, totals}   409 = sudah dicatat / mirip Strava
   GET  /quests                     -> {active[], done[]}
   POST /quests/:id/claim           {proof} -> {quest, totals}
   GET  /leaderboard?period&dim     -> {items[], me, of}
   GET  /rewards                    -> {coins, items[], redemptions[]}
   POST /rewards/:id/redeem         -> {redemption, coins}
   GET  /ledger?type=points|coins   -> {items[]}
   GET  /strava                     -> {state, athlete, lastSync, connectedAt, brokenSince, share, consentAt, recent[]}
   POST /strava/connect             {consent} -> {added[]}   (asli: redirect ke OAuth Strava)
                                    422 kalau belum setuju poin Strava tampil di peringkat
   POST /strava/share               {on} -> {share}   (tarik/beri lagi persetujuan peringkat)
   POST /strava/sync                -> {added[], lastSync}
   POST /strava/disconnect          -> {ok}
   ===================================================================== */

/* ---------- util ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = (name, cls = '') => `<span class="ms ${cls}" aria-hidden="true">${name}</span>`;
const nf = new Intl.NumberFormat('id-ID');
const n = v => nf.format(Math.round(v || 0));
const sum = arr => arr.reduce((a, b) => a + (b || 0), 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const TZ = 'Asia/Jakarta';
const isoOf = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const today = () => isoOf(new Date());
const addDays = (iso, k) => { const d = new Date(iso + 'T12:00:00+07:00'); d.setUTCDate(d.getUTCDate() + k); return isoOf(d); };
const dateObj = iso => new Date(iso + 'T12:00:00+07:00');
const fmt = (iso, o) => new Intl.DateTimeFormat('id-ID', { timeZone: TZ, ...o }).format(dateObj(iso));
const monthKey = iso => iso.slice(0, 7);
const dayLabel = iso => {
  const t = today();
  if (iso === t) return 'Hari ini';
  if (iso === addDays(t, -1)) return 'Kemarin';
  return fmt(iso, { weekday: 'short', day: 'numeric', month: 'short' });
};
const daysBetween = (a, b) => Math.round((dateObj(b) - dateObj(a)) / 86400000);
const timeAgo = ts => {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'baru saja';
  if (m < 60) return `${m} menit lalu`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} jam lalu`;
  return `${Math.round(h / 24)} hari lalu`;
};
const hourWIB = () => Number(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' }).format(new Date()));
const greet = () => { const h = hourWIB(); return h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam'; };
const readLS = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const writeLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* penyimpanan tidak tersedia */ } };
const removeLS = k => { try { localStorage.removeItem(k); } catch { /* abaikan */ } };
const haptic = () => { try { if (navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(12); } catch { /* abaikan */ } };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const avClass = name => 'av-' + DIMS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % DIMS.length].id;

/* ---------- metadata tampilan (bukan data) ---------- */
const DIMS = [
  { id: 'physical', name: 'Fisik', icon: 'directions_run' },

    return { activity: act, totals: totalsFull(DB) };
  }
  if (route === 'GET /quests') {
    const t = today();
    return { active: DB.quests.filter(x => x.status === 'active' && x.ends >= t).sort((a, b) => a.ends.localeCompare(b.ends)),
      done: DB.quests.filter(x => x.status === 'done').sort((a, b) => b.claimedAt.localeCompare(a.claimedAt)) };
  }
  if ((m = p.match(/^\/quests\/(\w+)\/claim$/)) && method === 'POST') {
    const qq = DB.quests.find(x => x.id === m[1]);
    if (!qq) throw new ApiError('Quest tidak ditemukan.', 404);
    if (qq.status === 'done') throw new ApiError('Quest ini sudah kamu klaim.', 409);
    if (qq.ends < today()) throw new ApiError('Quest sudah berakhir.', 409);
    if (qq.proof === 'photo' && !body.photos) throw new ApiError('Tambahkan foto bukti.', 422);
    if (qq.proof === 'text' && String(body.text || '').trim().length < 10) throw new ApiError('Tulis minimal 10 huruf.', 422);
    if (qq.proof === 'instagram' && (!body.account || !body.link)) throw new ApiError('Isi akun Instagram dan tautan postingan.', 422);
    qq.status = 'done'; qq.claimedAt = today();
    return { quest: qq, totals: totalsFull(DB) };
  }
  if (route === 'GET /leaderboard') return board(DB, q.get('period') || 'month', q.get('dim') || 'all');
  if (route === 'GET /rewards') return { coins: computeTotals(DB).coins, items: DB.rewards, redemptions: [...DB.redemptions].sort((a, b) => b.date.localeCompare(a.date)) };
  if ((m = p.match(/^\/rewards\/(\w+)\/redeem$/)) && method === 'POST') {
    const rw = DB.rewards.find(x => x.id === m[1]);
    if (!rw) throw new ApiError('Reward tidak ditemukan.', 404);
    if (rw.stock < 1) throw new ApiError('Stok habis.', 409);
    if (computeTotals(DB).coins < rw.cost) throw new ApiError('Koin belum cukup.', 409);
    rw.stock -= 1;
    const rd = { id: 'rd' + Date.now(), rewardId: rw.id, name: rw.name, icon: rw.icon, cost: rw.cost, date: today(), status: 'processing' };
    DB.redemptions.push(rd);
    return { redemption: rd, coins: computeTotals(DB).coins };
  }
  if (route === 'GET /ledger') {
    const type = q.get('type') || 'points';
    if (type === 'points') {
      const items = [
        ...counted(DB).map(a => ({ date: a.date, title: a.name, sub: a.source === 'strava' ? 'Strava' : DIM[a.dim].name, amount: a.points, icon: actIcon(a), dim: a.dim })),
        ...DB.quests.filter(x => x.status === 'done').map(x => ({ date: x.claimedAt, title: x.title, sub: 'Quest', amount: x.points, icon: 'flag', dim: x.dim })),
        ...DB.adjustments.map(x => ({ date: x.date, title: x.title, sub: 'Admin', amount: x.points, icon: 'tune', dim: x.dim })),
        { date: DB.baseSince, title: 'Poin dari aplikasi lama', sub: 'Dipindah saat peralihan', amount: DB.basePoints, icon: 'history', dim: null },
      ].sort((a, b) => b.date.localeCompare(a.date));
      return { items };
    }
    const t = computeTotals(DB);
    const earnedSince = t.points - DB.basePoints;
    const items = [
      ...DB.redemptions.map(r => ({ date: r.date, title: `Tukar ${r.name}`, sub: 'Rewards', amount: -r.cost, icon: 'redeem' })),
      { date: today(), title: 'Koin dari poin baru', sub: '1 poin = 1 koin', amount: earnedSince, icon: 'add_circle' },
      { date: DB.baseSince, title: 'Koin dari aplikasi lama', sub: 'Dipindah saat peralihan', amount: DB.basePoints - DB.baseSpent, icon: 'history' },
    ].sort((a, b) => b.date.localeCompare(a.date));
    return { items };
  }
  if (route === 'GET /strava') return stravaView(DB);
  if (route === 'POST /strava/sync') {
    if (DB.strava.state !== 'connected') throw new ApiError('Strava belum tersambung.', 409);
    const added = [];
    if (Math.random() < .5) {
      const a = { id: String(Date.now()), date: today(), kind: 'sport', sport: 'walking', dim: 'physical', name: 'Jalan sore', kcal: 186, points: 186, source: 'strava', status: 'approved', photos: 0, note: '', distanceKm: 2.6, minutes: 31 };
      DB.activities.push(a); added.push(a);
    }
    DB.strava.lastSync = Date.now();
    return { added, lastSync: DB.strava.lastSync };
  }
  if (route === 'POST /strava/connect') {
    const was = DB.strava.state, s = DB.strava;
    if (was === 'none' && !body.consent) throw new ApiError('Centang persetujuan dulu untuk menyambungkan Strava.', 422, 'consent');
    if (body.consent) { s.share = true; s.consentAt = today(); }
    s.state = 'connected'; s.lastSync = Date.now(); s.athlete = DB.me.name;
    if (was === 'none') s.connectedAt = today();
    const since = was === 'broken' && s.brokenSince ? s.brokenSince : addDays(today(), -3);
    const added = [
      { id: String(Date.now()), date: since, kind: 'sport', sport: 'running', dim: 'physical', name: 'Lari pagi', kcal: 402, points: 402, source: 'strava', status: 'approved', photos: 0, note: '', distanceKm: 5.0, minutes: 33 },
      { id: String(Date.now() + 1), date: addDays(since, 1) > today() ? since : addDays(since, 1), kind: 'sport', sport: 'cycling', dim: 'physical', name: 'Gowes ke kantor', kcal: 288, points: 288, source: 'strava', status: 'approved', photos: 0, note: '', distanceKm: 9.1, minutes: 32 },
    ];
    DB.activities.push(...added);
    s.brokenSince = null;
    return { added };
  }
  if (route === 'POST /strava/share') {
    if (DB.strava.state === 'none') throw new ApiError('Strava belum tersambung.', 409);
    DB.strava.share = !!body.on;
    if (body.on) DB.strava.consentAt = today();
    return { share: DB.strava.share };
  }
  if (route === 'POST /strava/disconnect') { Object.assign(DB.strava, { state: 'none', brokenSince: null, share: false, consentAt: null }); return { ok: true }; }
  throw new ApiError(`Tidak ada rute ${route}`, 404);
}

/* ---------- pengaturan prototipe ---------- */
const settings = Object.assign({ theme: 'system', net: 'normal', fail: false }, readLS('wb-proto-settings') || {});
const saveSettings = () => writeLS('wb-proto-settings', settings);
const LATENCY = { fast: [60, 160], normal: [320, 820], slow: [1400, 2600] };

/* =====================================================================
   LAPISAN API — satu-satunya tempat yang diganti untuk API asli:
     request: (method, path, body) => fetch('/api/wellbeing' + path, {...}).then(...)
   ===================================================================== */
const api = {
  async request(method, path, body) {
    const [lo, hi] = LATENCY[settings.net] || LATENCY.normal;
    await sleep(lo + Math.random() * (hi - lo));
    if (!navigator.onLine) throw new ApiError('Kamu sedang offline.', 0, 'offline');
    if (settings.fail && Math.random() < .6) throw new ApiError('Server belum bisa dihubungi. Coba lagi sebentar.', 503, 'network');
    const res = server(method, path, body ? clone(body) : undefined);
    saveDB();
    return clone(res);
  },
  get(path) { return this.request('GET', path); },
  post(path, body) { return this.request('POST', path, body || {}); },
  /** Unggah satu foto. Asli: minta URL unggah (R2) lalu PUT berkasnya. */
  async upload(file) {
    const [lo, hi] = LATENCY[settings.net] || LATENCY.normal;
    await sleep(lo + Math.random() * (hi - lo));
    if (settings.fail && Math.random() < .3) throw new ApiError('Foto gagal diunggah. Coba lagi.', 503, 'network');
    return { key: 'wb/' + Date.now() + '-' + (file.name || 'foto') };
  },
};

/* ---------- cache (tampil dulu dari cache, lalu diperbarui) ---------- */
const cache = new Map();
const PHOTOS = {}; // id aktivitas -> URL foto lokal (hanya sesi ini)
function findActivity(id) {
  for (const v of cache.values()) {
    const list = v?.items || v?.recent;
    const hit = Array.isArray(list) && list.find(x => x && x.id === id && x.kind);
    if (hit) return hit;
  }
  return null;
}

/* =====================================================================
   NAVIGASI (stack seperti aplikasi native, tanpa muat ulang halaman)
   ===================================================================== */
const app = $('#app'), screensEl = $('#screens'), tabbar = $('#tabbar');
const ROUTES = {
  beranda: { tab: true, title: 'Beranda', mount: mountHome },
  quest: { tab: true, title: 'Quest', mount: mountQuests },
  peringkat: { tab: true, title: 'Peringkat', mount: mountBoard },
  rewards: { tab: true, title: 'Rewards', mount: mountRewards },
  riwayat: { title: 'Riwayat aktivitas', mount: mountHistory },
  profil: { title: 'Profil', mount: mountProfile },
  strava: { title: 'Strava', mount: mountStrava },
  ledger: { title: 'Riwayat poin & koin', mount: mountLedger },

const tabCtx = {};
let stack = [];
let histIndex = 0;
let SESSION = readLS('wb-proto-session');

function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const name = ROUTES[parts[0]] ? parts[0] : 'beranda';
  return { name, params: parts.slice(1) };
}
function barAvatar() {
  const nm = SESSION?.me?.name || 'Saya';
  return `<button class="bar-avatar" data-nav="profil" aria-label="Profil"><span class="avatar sm ${avClass(nm)}">${esc(initials(nm))}</span></button>`;
}
function createCtx(name, params) {
  const r = ROUTES[name];
  const el = document.createElement('section');
  el.className = 'screen ' + (r.tab ? 'is-tab' : 'is-push');
  el.setAttribute('aria-label', r.title);
  el.innerHTML = `
    <header class="bar ${r.tab ? '' : 'always'}">
      ${r.tab ? '' : `<button class="icon-btn" data-action="back" aria-label="Kembali">${I('arrow_back')}</button>`}
      <h1 class="bar-title">${esc(r.title)}</h1>
      <div class="bar-actions">${r.tab ? barAvatar() : ''}</div>
    </header>
    <div class="ptr">${I('refresh', 'sm')}</div>
    <main class="scroll"><div class="content"></div></main>`;
  const ctx = { name, params, route: r, el, content: $('.content', el), scroller: $('.scroll', el), bar: $('.bar', el), state: {}, reload: null };
  el.__ctx = ctx;
  const th = r.tab ? 36 : 2;
  ctx.scroller.addEventListener('scroll', () => ctx.bar.classList.toggle('scrolled', ctx.scroller.scrollTop > th), { passive: true });
  setupPullToRefresh(ctx);
  return ctx;
}
function animate(el, cls, done) {
  el.classList.remove('anim-push-in', 'anim-push-under', 'anim-pop-out', 'anim-pop-under', 'anim-fade');
  void el.offsetWidth;
  el.classList.add(cls);
  let fin = false;
  const end = () => {
    if (fin) return; fin = true;
    el.removeEventListener('animationend', onEnd);
    if (cls !== 'anim-push-under') el.classList.remove(cls);
    done && done();
  };
  const onEnd = e => { if (e.target === el) end(); };
  el.addEventListener('animationend', onEnd);
  setTimeout(end, 480);
}
function setTabbar(name) {
  $$('.tab[data-tab]', tabbar).forEach(a => { if (a.dataset.tab === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function showTab(name, anim = true) {
  const prev = stack[0];
  if (prev && prev.name === name) { prev.scroller.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); return; }
  let ctx = tabCtx[name];
  if (!ctx) { ctx = tabCtx[name] = createCtx(name, []); screensEl.appendChild(ctx.el); ctx.route.mount(ctx); }
  else { ctx.el.hidden = false; ctx.reload && ctx.reload(); }
  stack.slice(1).forEach(c => c.el.remove());
  if (prev && prev !== ctx) prev.el.hidden = true;
  stack = [ctx];
  if (anim) animate(ctx.el, 'anim-fade');
  setTabbar(name);
  app.classList.remove('no-nav'); tabbar.inert = false;
}
function pushScreen(name, params, anim = true) {
  const under = stack[stack.length - 1];
  const ctx = createCtx(name, params);
  screensEl.appendChild(ctx.el);
  ctx.route.mount(ctx);
  stack.push(ctx);
  app.classList.add('no-nav'); tabbar.inert = true;
  if (anim && under) {
    animate(ctx.el, 'anim-push-in');
    animate(under.el, 'anim-push-under', () => { if (stack.includes(ctx)) under.el.classList.add('under'); });
  } else if (under) under.el.classList.add('under');
}
function popScreen(anim = true) {
  if (stack.length < 2) return;
  const top = stack.pop(), under = stack[stack.length - 1];
  under.el.classList.remove('under');
  under.reload && under.reload();
  if (anim) { animate(top.el, 'anim-pop-out', () => top.el.remove()); animate(under.el, 'anim-pop-under'); }
  else { top.el.remove(); under.el.classList.remove('anim-push-under'); }
  if (stack.length === 1) { app.classList.remove('no-nav'); tabbar.inert = false; }
}
function go(name, params = []) {
  const r = ROUTES[name];
  if (!r) return;
  if (r.tab) {
    if (stack.length > 1) return;
    history.replaceState({ i: histIndex }, '', '#/' + name);
    showTab(name);
  } else {
    histIndex++;
    history.pushState({ i: histIndex }, '', '#/' + [name, ...params].join('/'));
    pushScreen(name, params);
  }
}
function goBack() { if (histIndex > 0) history.back(); else popScreen(); }
addEventListener('popstate', e => {
  if (currentSheet) { currentSheet._finish(); return; }
  const i = e.state?.i ?? 0;
  if (i < histIndex) { const times = histIndex - i; histIndex = i; for (let k = 0; k < times; k++) popScreen(k === times - 1); }
  else if (i > histIndex) { histIndex = i; const { name, params } = parseHash(); if (!ROUTES[name].tab) pushScreen(name, params); }
});

/* ---------- memuat data ke layar ---------- */
async function loadInto(ctx, key, render, skeleton, target) {
  const host = target || ctx.content;
  const cached = cache.get(key);
  if (cached) render(cached); else host.innerHTML = skeleton();
  try {
    const data = await api.get(key);
    const changed = !cached || JSON.stringify(cached) !== JSON.stringify(data);
    cache.set(key, data);
    if (ctx.el.isConnected && changed) render(data);
    return data;
  } catch (e) {
    if (!ctx.el.isConnected) return null;
    if (!cached) {
      host.innerHTML = errorState(e.message);
      $('[data-retry]', host)?.addEventListener('click', () => loadInto(ctx, key, render, skeleton, target));
    } else toast('Belum bisa memperbarui. Yang tampil data terakhir.', 'warning');
    return null;
  }
}
function errorState(msg) {
  return `<div class="state"><div class="lead d-social">${I('cloud_off')}</div><h2 class="t-sub">Belum bisa dimuat</h2><p>${esc(msg)}</p><button class="btn btn-tonal" data-retry>${I('refresh', 'sm')}Coba lagi</button></div>`;
}
const afterMutation = () => {
  // Data berubah: semua layar yang terbuka diperbarui di latar (tanpa kerangka loading).
  [...new Set([...Object.values(tabCtx), ...stack])].forEach(c => { if (c.el.isConnected && !c.el.hidden && c.reload) c.reload(); });
};
function setupPullToRefresh(ctx) {
  const sc = ctx.scroller, ind = $('.ptr', ctx.el);
  let y0 = null, dy = 0, busy = false;
  sc.addEventListener('touchstart', e => { if (busy || sc.scrollTop > 0) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  sc.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    const p = Math.max(0, Math.min(dy, 120));
    ind.style.opacity = Math.min(1, p / 64);
    ind.style.transform = `translate(-50%, ${p * .6}px) rotate(${p * 3}deg)`;
  }, { passive: true });
  sc.addEventListener('touchend', async () => {
    if (y0 === null) return;
    y0 = null;
    if (dy > 72 && ctx.reload) {
      busy = true; ind.classList.add('spinning'); ind.style.transform = 'translate(-50%, 44px)'; haptic();
      try { await ctx.reload(); } finally { busy = false; ind.classList.remove('spinning'); ind.style.transform = ''; ind.style.opacity = 0; }
    } else { ind.style.transform = ''; ind.style.opacity = 0; }
  });
}

/* ---------- lembar bawah ---------- */
let currentSheet = null;
function openSheet({ tall = false, label = 'Lembar', onClose } = {}) {
  if (currentSheet) currentSheet.destroy();
  const root = document.createElement('div');
  root.className = 'sheet-root';
  root.innerHTML = `<div class="scrim" data-sheet-close></div>
    <section class="sheet ${tall ? 'tall' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1">
      <div class="grab" aria-hidden="true"><span></span></div>
      <header class="sheet-head">
        <button class="icon-btn" data-sheet-back hidden aria-label="Kembali">${I('arrow_back')}</button>
        <h2 class="sheet-title t-sub"></h2>
        <button class="icon-btn" data-sheet-close aria-label="Tutup">${I('close')}</button>
      </header>
      <div class="sheet-body"></div>
      <footer class="sheet-foot" hidden></footer>
    </section>`;
  const el = $('.sheet', root);
  const lastFocus = document.activeElement;
  app.appendChild(root);
  app.classList.add('has-sheet');
  screensEl.inert = true; tabbar.inert = true;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  history.pushState({ i: histIndex, sheet: true }, '', location.href);
  let closed = false;
  const waiters = [];
  const s = {
    root, el, body: $('.sheet-body', root), foot: $('.sheet-foot', root), backFn: null,
    setTitle(t) { $('.sheet-title', root).textContent = t || ''; },
    setBack(fn) { this.backFn = fn; $('[data-sheet-back]', root).hidden = !fn; },
    setBody(html, dir) { this.body.innerHTML = `<div class="step ${dir ? 'step-' + dir : ''}">${html}</div>`; this.body.scrollTop = 0; },
    setFoot(html) { this.foot.innerHTML = html || ''; this.foot.hidden = !html; },
    close() {
      if (closed) return Promise.resolve();
      return new Promise(res => { waiters.push(res); if (history.state && history.state.sheet) history.back(); else s._finish(); });
    },
    _finish() {
      if (closed) return;
      closed = true;
      root.classList.remove('open'); root.classList.add('closing');
      app.classList.remove('has-sheet');
      screensEl.inert = false; tabbar.inert = stack.length > 1;
      if (currentSheet === s) currentSheet = null;
      onClose && onClose();
      setTimeout(() => root.remove(), 260);
      lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
      waiters.forEach(w => w());
    },
    destroy() {
      closed = true; root.remove(); app.classList.remove('has-sheet');
      screensEl.inert = false; tabbar.inert = stack.length > 1;
      if (history.state && history.state.sheet) history.replaceState({ i: histIndex }, '', location.href);
      if (currentSheet === s) currentSheet = null;
    },
  };
  // Tarik ke bawah untuk menutup.
  let y0 = null, dy = 0, t0 = 0;
  const drag = $$('.grab, .sheet-head', root);
  drag.forEach(h => h.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    y0 = e.clientY; dy = 0; t0 = performance.now(); el.style.transition = 'none'; h.setPointerCapture(e.pointerId);
  }));
  drag.forEach(h => h.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${dy}px)`; }));
  drag.forEach(h => h.addEventListener('pointerup', () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, performance.now() - t0);
    y0 = null; el.style.transition = ''; el.style.transform = '';
    if (dy > 110 || v > .6) s.close();
  }));
  currentSheet = s;
  setTimeout(() => el.focus({ preventScroll: true }), 60);
  return s;
}
function confirmSheet({ title, body, ok, danger = false }) {
  return new Promise(resolve => {
    let result = false;
    const sh = openSheet({ label: title, onClose: () => resolve(result) });
    sh.setTitle(title);
    sh.setBody(`<p class="muted">${body}</p>`);
    sh.setFoot(`<div class="btn-row"><button class="btn btn-outline" data-sheet-close>Batal</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(ok)}</button></div>`);
    $('[data-ok]', sh.foot).addEventListener('click', () => { result = true; sh.close(); });
  });
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, type = '', action) {
  const host = $('#toasts');
  host.innerHTML = '';
  const icon = { success: 'check_circle', error: 'error', warning: 'warning', info: 'info' }[type];
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `${icon ? I(icon, 'sm') : ''}<span>${esc(msg)}</span>${action ? `<button class="toast-act">${esc(action.label)}</button>` : ''}`;
  if (action) $('.toast-act', el).addEventListener('click', () => { el.remove(); action.run(); });

}

/* ---------- potongan tampilan ---------- */
function pointsTag(a) {
  if (a.status === 'rejected') return `<span class="pill err">Ditolak</span>`;
  if (a.status === 'adjusted') return `<b class="pts">+${n(a.points)}</b><span class="pill warn">Diubah admin</span>`;
  return `<b class="pts">+${n(a.points)}</b>`;
}
function actMeta(a) {
  if (a.kind === 'sport') {
    const bits = [a.source === 'strava' ? 'Strava' : 'Olahraga'];
    if (a.distanceKm) bits.push(`${String(a.distanceKm).replace('.', ',')} km`);
    if (a.minutes) bits.push(`${a.minutes} mnt`);
    return bits.join(' · ');
  }

function endsLabel(iso) {

function stravaBanner(s) {

  if (s.state === 'broken') return `<button class="banner warn pressable" data-nav="strava">${I('link_off')}<span class="row-main"><b>Strava terputus</b><span>Aktivitas sejak ${fmt(s.brokenSince, { day: 'numeric', month: 'short' })} belum masuk. Sambungkan ulang.</span></span>${I('chevron_right')}</button>`;

}
function countUp(el, from, to) {
  if (!el || reduceMotion()) return;
  const t0 = performance.now(), dur = 650;
  const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = n(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function mountHistory(ctx) {
  const st = ctx.state; st.filter = st.filter || 'all';
  const FILTERS = [['all', 'Semua'], ['daily', 'Harian'], ['sport', 'Olahraga'], ['strava', 'Strava']];
  ctx.content.innerHTML = `<div class="seg" role="group" aria-label="Filter" style="margin:4px 0 16px">${FILTERS.map(([k, l]) => `<button data-f="${k}" aria-pressed="${st.filter === k}">${l}</button>`).join('')}</div><div class="js-list"></div><div class="js-more"></div>`;
  const listEl = $('.js-list', ctx.content), moreEl = $('.js-more', ctx.content);
  let items = [], page = 1, hasMore = false, loading = false, io = null;
  const group = arr => {
    const out = []; let cur = null;
    arr.forEach(a => { if (!cur || cur.date !== a.date) { cur = { date: a.date, items: [] }; out.push(cur); } cur.items.push(a); });
    return out;
  };
  const draw = () => {
    if (!items.length) { listEl.innerHTML = `<div class="card empty"><div class="lead tone-primary">${I('history')}</div>Belum ada aktivitas di sini.</div>`; moreEl.innerHTML = ''; return; }
    listEl.innerHTML = group(items).map(g => `<div class="group-label" style="margin-top:${g === undefined ? 0 : 16}px">${dayLabel(g.date)}${g.date !== today() && g.date !== addDays(today(), -1) ? '' : ' · ' + fmt(g.date, { day: 'numeric', month: 'short' })}</div><div class="card list">${g.items.map(a => actRow(a, false)).join('')}</div>`).join('');
    listEl.firstElementChild && (listEl.firstElementChild.style.marginTop = '0');
    moreEl.innerHTML = hasMore ? `<div class="js-sentinel" style="padding:16px 0">${skRows(2)}</div>` : `<p class="caption faint center" style="padding:20px 0">Sudah semua</p>`;
    if (hasMore) observe();
  };
  const observe = () => {
    io && io.disconnect();
    const sen = $('.js-sentinel', moreEl);
    if (!sen) return;
    io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadMore(); }, { root: ctx.scroller, rootMargin: '200px' });
    io.observe(sen);
  };
  const key = (f, pg) => `/activities?filter=${f}&page=${pg}`;
  const loadFirst = () => loadInto(ctx, key(st.filter, 1), d => { items = d.items; page = 1; hasMore = d.hasMore; draw(); }, () => skRows(6), listEl);
  const loadMore = async () => {
    if (loading || !hasMore) return;
    loading = true;
    try { const d = await api.get(key(st.filter, page + 1)); cache.set(key(st.filter, page + 1), d); page++; items = items.concat(d.items); hasMore = d.hasMore; draw(); }
    catch (e) { moreEl.innerHTML = `<div class="center" style="padding:12px 0"><button class="btn btn-tonal js-retry-more">${I('refresh', 'sm')}Muat lagi</button></div>`; $('.js-retry-more', moreEl).addEventListener('click', loadMore); }
    finally { loading = false; }
  };
  ctx.content.addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (!b || b.dataset.f === st.filter) return;
    st.filter = b.dataset.f;
    $$('[data-f]', ctx.content).forEach(x => x.setAttribute('aria-pressed', x.dataset.f === st.filter));
    moreEl.innerHTML = '';
    loadFirst();
  });
  ctx.reload = loadFirst;
  loadFirst();
}

function photoBlock(photos, hint, invalid) {

}
function photoTiles(photos, invalid) {
  return photos.map((p, i) => `<div class="ph"><img src="${p.url}" alt="Foto ${i + 1}"><button type="button" class="rm" data-rm="${i}" aria-label="Hapus foto ${i + 1}">${I('close')}</button></div>`).join('')
    + (photos.length < MAX_PHOTOS ? `<button type="button" class="ph ph-add ${invalid ? 'invalid' : ''}" data-add-photo>${I('add_a_photo')}<span>Tambah</span></button>` : '');
}
function samplePhoto(label) {
  return new Promise(res => {
    const c = document.createElement('canvas'); c.width = 480; c.height = 480;
    const g = c.getContext('2d');
    const hue = Math.floor(Math.random() * 360);
    g.fillStyle = `hsl(${hue} 45% 86%)`; g.fillRect(0, 0, 480, 480);
    g.fillStyle = `hsl(${hue} 40% 38%)`; g.font = '600 34px sans-serif'; g.textAlign = 'center';
    g.fillText('Foto contoh', 240, 230); g.font = '400 24px sans-serif'; g.fillText(label.slice(0, 28), 240, 272);
    c.toBlob(b => res({ name: 'contoh.png', size: b.size, url: URL.createObjectURL(b) }), 'image/png');
  });
}
function bindPhotos(sh, st, label, onChange) {
  const refresh = () => {
    const host = $('.js-photos', sh.body);
    if (host) host.innerHTML = photoTiles(st.photos, false);
    const err = $('.js-err-photos', sh.body); if (err && st.photos.length) err.hidden = true;
    onChange && onChange();
  };
  sh.body.addEventListener('click', async e => {
    if (e.target.closest('[data-add-photo]')) { $('.js-file', sh.body)?.click(); return; }
    const rm = e.target.closest('[data-rm]');
    if (rm) { const [p] = st.photos.splice(Number(rm.dataset.rm), 1); if (p) URL.revokeObjectURL(p.url); refresh(); return; }
    if (e.target.closest('.js-sample') && st.photos.length < MAX_PHOTOS) { st.photos.push(await samplePhoto(label())); refresh(); }
  });
  sh.body.addEventListener('change', e => {
    if (!e.target.matches('.js-file')) return;
    const files = [...e.target.files].slice(0, MAX_PHOTOS - st.photos.length);
    files.forEach(f => st.photos.push({ name: f.name, size: f.size, url: URL.createObjectURL(f) }));
    e.target.value = '';
    refresh();
  });
}

        <label class="field"><span class="lbl">Durasi <span class="faint">(opsional)</span></span><div class="input-wrap"><input class="input" name="minutes" inputmode="numeric" autocomplete="off" placeholder="0" value="${esc(st.minutes)}"><span class="suffix">menit</span></div></label>
      </div>
      <span class="help" style="display:block;margin-top:6px">Kalori dari jam tangan atau aplikasi olahraga. 1 kkal = 1 poin, maksimal ${n(MAX_KCAL)}.</span>
      <span class="err-text js-err-kcal" hidden style="margin-top:4px">${I('error', 'xs')}Isi kalori 1 sampai ${n(MAX_KCAL)}.</span>
      ${photoBlock(st.photos, 'Foto layar jam atau aplikasi yang menunjukkan kalori', false)}
      <label class="field"><span class="lbl">Catatan <span class="faint">(opsional)</span></span><textarea class="input" name="note" maxlength="300" placeholder="mis. Main badminton bareng tim">${esc(st.note)}</textarea></label>`, dir);
    foot();
  }
  function drawDone() {
    const a = st.result.activity, t = st.result.totals;
    sh.setTitle(''); sh.setBack(null);
    sh.setBody(`<div class="done">
      <div class="done-mark">${I('check')}</div>
      <h3 class="t-headline">Tercatat</h3>
      <p class="muted">${esc(a.name)} · ${dayLabel(a.date)}</p>
      <p class="done-pts">+${n(a.points)} poin</p>
      <p class="muted">Total poinmu sekarang <b>${n(t.points)}</b> · ${n(t.coins)} koin</p>
    </div>
    <div class="note">${I('verified', 'sm')}<span>Poin langsung masuk. Admin bisa memeriksa bukti; kalau ada yang diubah atau ditolak, alasannya muncul di Riwayat.</span></div>`, 'fwd');
    sh.setFoot(`<div class="btn-row"><button class="btn btn-outline js-again">Catat lagi</button><button class="btn btn-primary" data-sheet-close>Selesai</button></div>`);
  }
  function foot() {
    if (st.step === 'done') return;
    const pts = preview();
    let warn = '';
    if (st.error && st.errorCode === 'strava_twin') warn = `<div class="note warn">${I('warning', 'sm')}<span>${esc(st.error)}<span class="note-act"><button class="btn btn-outline js-force" style="min-height:40px">Tetap simpan</button></span></span></div>`;
    else if (st.error) warn = `<div class="note err">${I('error', 'sm')}<span>${esc(st.error)}</span></div>`;
    sh.setFoot(`${warn}${st.saving && st.prog != null ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(st.prog * 100)}"><i style="width:${Math.round(st.prog * 100)}%"></i></div>` : ''}
      <button class="btn btn-primary block js-save ${st.saving ? 'is-busy' : ''}" ${st.saving ? 'aria-busy="true"' : ''}>${st.saving ? `<span class="spin"></span>${esc(st.progress || 'Menyimpan…')}` : `Simpan${pts ? ` · +${n(pts)} poin` : ''}`}</button>`);
  }
  function showErr(sel, on) { const el = $(sel, sh.body); if (el) el.hidden = !on; }
  function validate() {
    let ok = true;
    const t = st.kind === 'daily' ? typeOf() : null;
    if (st.kind === 'sport') {
      const s = !!st.sport; showErr('.js-err-sport', !s); ok = ok && s;
      const k = Number(st.kcal) >= 1 && Number(st.kcal) <= MAX_KCAL; showErr('.js-err-kcal', !k); $('[name=kcal]', sh.body)?.classList.toggle('invalid', !k); ok = ok && k;
    }
    if (t?.steps) { const v = Number(st.steps) >= 100 && Number(st.steps) <= 60000; showErr('.js-err-steps', !v); $('[name=steps]', sh.body)?.classList.toggle('invalid', !v); ok = ok && v; }
    const ph = st.photos.length > 0; showErr('.js-err-photos', !ph); $('[data-add-photo]', sh.body)?.classList.toggle('invalid', !ph); ok = ok && ph;
    if (!ok) { const first = $$('.err-text:not([hidden])', sh.body)[0]; first && first.closest('.field, .err-text').scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
    return ok;
  }
  async function save(force = false) {
    if (st.saving) return;
    st.tried = true;
    if (!validate()) return;
    st.saving = true; st.error = null; st.errorCode = null; st.prog = 0; foot();
    try {
      for (let i = 0; i < st.photos.length; i++) {
        st.progress = `Mengunggah foto ${i + 1} dari ${st.photos.length}…`; st.prog = i / st.photos.length; foot();
        await api.upload(st.photos[i]);
      }
      st.prog = 1; st.progress = 'Menyimpan…'; foot();
      const body = st.kind === 'daily'
        ? { kind: 'daily', code: st.code, date: st.date, steps: Number(st.steps) || null, note: st.note, photos: st.photos.length }
        : { kind: 'sport', sport: st.sport, date: st.date, kcal: Number(st.kcal), minutes: Number(st.minutes) || null, note: st.note, photos: st.photos.length, force };
      const res = await api.post('/activities', body);
      st.photos.forEach(p => keep.add(p.url));
      PHOTOS[res.activity.id] = st.photos.map(p => p.url);
      st.result = res; st.saving = false; st.step = 'done';
      cache.delete('/catalog'); cat = null; loadCatalog();
      draw('fwd'); haptic();
      afterMutation();
    } catch (e) {
      st.saving = false; st.prog = null; st.error = e.message; st.errorCode = e.code; foot();
    }
  }

  sh.body.addEventListener('click', e => {
    const k = e.target.closest('[data-kind]');
    if (k) { st.kind = k.dataset.kind; st.step = st.kind === 'daily' ? 'dim' : 'sport'; draw('fwd'); return; }
    const d = e.target.closest('[data-dim]');
    if (d) { st.dim = d.dataset.dim; st.step = 'type'; draw('fwd'); return; }
    const c = e.target.closest('[data-code]');
    if (c && !c.disabled) { if (st.code !== c.dataset.code) { st.steps = ''; } st.code = c.dataset.code; st.step = 'detail'; draw('fwd'); return; }
    const s = e.target.closest('[data-sport]');
    if (s) {
      st.sport = s.dataset.sport;
      $$('[data-sport]', sh.body).forEach(b => b.setAttribute('aria-pressed', b.dataset.sport === st.sport));
      showErr('.js-err-sport', false); st.error = null; foot(); return;
    }
  });
  sh.body.addEventListener('input', e => {
    const nm = e.target.name;
    if (!nm) return;
    if (['steps', 'kcal', 'minutes'].includes(nm)) e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
    st[nm] = e.target.value;
    if (nm === 'steps') { const h = $('.js-steps-help', sh.body); if (h) h.textContent = st.steps ? `= ${n(preview())} poin` : '10 langkah = 1 poin'; }
    if (st.tried) validate();
    if (['steps', 'kcal', 'date'].includes(nm)) { st.error = null; foot(); }
  });
  bindPhotos(sh, st, () => (st.kind === 'sport' ? SPORT[st.sport]?.name : typeOf()?.name) || 'Aktivitas', () => { if (st.tried) validate(); });
  sh.foot.addEventListener('click', e => {
    if (e.target.closest('.js-save')) save(false);
    else if (e.target.closest('.js-force')) save(true);
    else if (e.target.closest('.js-again')) { st = Object.assign(st, fresh()); draw('back'); }
  });
  sh.el.addEventListener('click', e => { if (e.target.closest('[data-sheet-back]') && sh.backFn) sh.backFn(); });

  if (preset.code && CAT[preset.code]) { st.kind = 'daily'; st.dim = CAT[preset.code].dim; st.code = preset.code; st.step = 'detail'; }
  draw(null);
}

      <div class="row"><span class="kv"><span>Stok</span><span>${r.stock}</span></span></div>
    </div>`);
  const foot = () => sh.setFoot(`${error ? `<div class="note err">${I('error', 'sm')}<span>${esc(error)}</span></div>` : ''}${short || r.stock < 1
    ? `<button class="btn btn-primary block" disabled>${r.stock < 1 ? 'Stok habis' : `Koin kurang ${n(short)}`}</button>`
    : `<button class="btn btn-primary block js-redeem ${saving ? 'is-busy' : ''}">${saving ? '<span class="spin"></span>Menukar…' : `Tukar ${n(r.cost)} koin`}</button>`}`);
  foot();
  sh.foot.addEventListener('click', async e => {
    if (!e.target.closest('.js-redeem') || saving) return;
    saving = true; error = null; foot();
    try {
      const res = await api.post(`/rewards/${r.id}/redeem`);
      haptic();
      sh.setBody(`<div class="done"><div class="done-mark">${I('check')}</div><h3 class="t-headline">Penukaran dicatat</h3><p class="muted">${esc(r.name)}</p><p class="muted" style="margin-top:8px">HR akan menghubungimu untuk pengambilan. Sisa koin <b>${n(res.coins)}</b>.</p></div>`, 'fwd');
      sh.setFoot(`<button class="btn btn-primary block" data-sheet-close>Selesai</button>`);
      afterMutation();
    } catch (err) { saving = false; error = err.message; foot(); }
  });
}

        <button class="row pressable" data-nav="riwayat"><span class="lead tone-primary">${I('history')}</span><span class="row-main"><span class="row-title">Riwayat aktivitas</span></span>${I('chevron_right', 'chev')}</button>

          <p class="help">Meniru lama jawaban server, supaya loading terlihat.</p></div>
        <div class="setting"><div class="lbl"><span>Server sering gagal</span><button class="switch" role="switch" data-set="fail" aria-checked="${settings.fail}" aria-label="Server sering gagal"></button></div>

        <div class="setting"><div class="lbl">Status Strava</div>
          <div class="seg" role="group" aria-label="Status Strava">${[['connected', 'Tersambung'], ['broken', 'Terputus'], ['none', 'Belum']].map(([k, l]) => `<button data-set="strava" data-v="${k}" aria-pressed="${d.strava.state === k}">${l}</button>`).join('')}</div></div>
